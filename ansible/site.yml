---
# Deploys the lab app as a systemd service behind nginx with a self-signed TLS certificate.
# Run:  ansible-playbook site.yml
- name: Deploy lab app behind nginx (HTTPS)
  hosts: labvm
  become: true
  vars:
    app_port: 8000
    server_name: lab-vm.local

  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name: [nginx, python3, openssl]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create system user for the app
      ansible.builtin.user:
        name: labapp
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create app directory
      ansible.builtin.file:
        path: /opt/labapp
        state: directory
        owner: labapp
        group: labapp
        mode: "0755"

    - name: Copy application
      ansible.builtin.copy:
        src: ../app/app.py
        dest: /opt/labapp/app.py
        owner: labapp
        group: labapp
        mode: "0644"
      notify: Restart labapp

    - name: Install systemd unit
      ansible.builtin.template:
        src: templates/labapp.service.j2
        dest: /etc/systemd/system/labapp.service
        mode: "0644"
      notify: Restart labapp

    - name: Enable and start the app
      ansible.builtin.systemd:
        name: labapp
        enabled: true
        state: started
        daemon_reload: true

    - name: Create TLS directory
      ansible.builtin.file:
        path: /etc/nginx/ssl
        state: directory
        mode: "0700"

    - name: Generate self-signed certificate
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -nodes -newkey rsa:2048 -days 365
          -keyout /etc/nginx/ssl/lab.key -out /etc/nginx/ssl/lab.crt
          -subj "/CN={{ server_name }}"
        creates: /etc/nginx/ssl/lab.crt
      notify: Reload nginx

    - name: Install nginx site
      ansible.builtin.template:
        src: templates/nginx-site.conf.j2
        dest: /etc/nginx/sites-available/labapp
        mode: "0644"
      notify: Reload nginx

    - name: Enable site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/labapp
        dest: /etc/nginx/sites-enabled/labapp
        state: link
      notify: Reload nginx

    - name: Disable default site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

  handlers:
    - name: Restart labapp
      ansible.builtin.systemd:
        name: labapp
        state: restarted
        daemon_reload: true

    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
